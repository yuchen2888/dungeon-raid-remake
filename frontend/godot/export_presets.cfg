; The iPhone export (T050-B): Godot writes an Xcode project into frontend/dist/ios/ (export_project_only), which
; frontend/tools/ios.sh builds for the simulator or a connected iPhone. The original files are added by
; include_filter from the local assets/original/, assets/lang/ and assets/hd/ (never in Git); the Apple developer team
; is left empty here: frontend/tools/ios.sh fills it in from frontend/godot/team_id.local (or DR_TEAM_ID) while it exports.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/original/*, assets/lang/*, assets/hd/*"
exclude_filter="tests/*, assets/original/*.icns"
export_path="../dist/ios/DungeonRaid.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

application/app_store_team_id=""
application/export_method_debug=1
application/export_method_release=1
application/bundle_identifier="com.yuchen.dungeonraid.remake"
application/short_version="0.2.1"
application/version="1"
application/min_ios_version="15.0"
application/targeted_device_family=0
application/export_project_only=true
application/icon_interpolation=4
icons/icon_1024x1024="res://assets/original/icon1024.png"
; (T050-I) the launch screen's picture scaled to fit the screen's width, where the main menu then appears
storyboard/image_scale_mode=2

; (T081) The shell app: none of the original's content (no assets/original, assets/hd, nor the language pictures and
; Spanish letters made from it), our translations, letters drawn with Source Han Sans, the import data assets/shell/
; (frontend/tools/make_shell_data.py), its own icon and launch picture (shell/, make_shell_art.py). Its folder shows
; in the Files app, where the player puts the original IPA (importer.gd). frontend/tools/shell_ipa.sh builds it.
[preset.1]

name="iOS shell"
platform="iOS"
runnable=true
dedicated_server=false
custom_features="shell"
export_filter="all_resources"
include_filter="assets/shell/*, assets/lang/*, shell/*"
exclude_filter="tests/*, assets/original/*, assets/hd/*, assets/lang/en/*, assets/lang/*/tiles.png*, assets/lang/*/menus.png*, assets/lang/es/font*"
export_path="../dist/shell/DungeonRaid.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

application/app_store_team_id=""
application/export_method_debug=1
application/export_method_release=1
application/bundle_identifier="io.github.yyc0409-ui.dungeonraid"
application/short_version="0.2.1"
application/version="1"
application/min_ios_version="15.0"
application/targeted_device_family=0
application/export_project_only=true
application/icon_interpolation=4
icons/icon_1024x1024="res://shell/icon.png"
user_data/accessible_from_files_app=true
user_data/accessible_from_itunes_sharing=true
; (T050-I) the launch screen's picture scaled to fit the screen's width, where the main menu then appears
storyboard/image_scale_mode=2
